    <script>
      (function() {
        try {
          var BASE_URL = 'https://singhlamedicos.co.in';
          var path = window.location.pathname || '';
          var hash = window.location.hash || '';
          var canonicalUrl = BASE_URL + '/';

          var medMatch = hash.match(/^#\/medicine\/([^\/?#]+)/) || path.match(/^\/medicine\/([^\/?#]+)/);
          var saltMatch = hash.match(/^#\/salt\/([^\/?#]+)/) || path.match(/^\/salt\/([^\/?#]+)/);

          if (medMatch && medMatch[1]) {
            canonicalUrl = BASE_URL + '/#/medicine/' + encodeURIComponent(decodeURIComponent(medMatch[1]));
          } else if (saltMatch && saltMatch[1]) {
            canonicalUrl = BASE_URL + '/#/salt/' + encodeURIComponent(decodeURIComponent(saltMatch[1]));
          } else if (hash.indexOf('#/salts') === 0 || path.indexOf('/salts') === 0) {
            canonicalUrl = BASE_URL + '/#/salts';
          }

          var canonicalLink = document.getElementById('canonical-url') || document.querySelector('link[rel="canonical"]');
          if (canonicalLink) {
            canonicalLink.setAttribute('href', canonicalUrl);
          } else {
            canonicalLink = document.createElement('link');
            canonicalLink.id = 'canonical-url';
            canonicalLink.rel = 'canonical';
            canonicalLink.href = canonicalUrl;
            document.head.appendChild(canonicalLink);
          }
        } catch (e) {}
      })();
    </script>
